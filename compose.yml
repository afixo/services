# Local development.
#
#   docker compose up -d                 # postgres only; run services with `make dev`
#   docker compose --profile full up     # also builds and runs all six services in containers
#
# Ports match .env.example so `cargo run` and the containers are interchangeable.

name: afixo

x-service: &service
  restart: unless-stopped
  profiles: [full]
  environment: &service-env
    RUST_LOG: info
    AUTH_URL: http://auth:50051
    IDENTITY_URL: http://identity:50051
    POLICY_URL: http://policy:50051
    DISCLOSURE_URL: http://disclosure:50051
    AUDIT_URL: http://audit:50051
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: afixo
      POSTGRES_PASSWORD: afixo
      POSTGRES_DB: afixo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afixo"]
      interval: 2s
      timeout: 2s
      retries: 20

  gateway:
    <<: *service
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      <<: *service-env
      CORS_ALLOWED_ORIGINS: http://localhost:4321
    ports: ["8080:8080", "8081:8081"]

  auth:
    <<: *service
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://afixo:afixo@postgres:5432/afixo_auth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: http://localhost:4321/api/v1/auth/github/callback

  identity:
    <<: *service
    build: { context: ., args: { SERVICE: identity } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://afixo:afixo@postgres:5432/afixo_identity

  policy:
    <<: *service
    build: { context: ., args: { SERVICE: policy } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://afixo:afixo@postgres:5432/afixo_policy

  disclosure:
    <<: *service
    build: { context: ., args: { SERVICE: disclosure } }

  audit:
    <<: *service
    build: { context: ., args: { SERVICE: audit } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://afixo:afixo@postgres:5432/afixo_audit

volumes:
  pgdata:
