[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/afixo/afixo-services"
publish = false

[workspace.dependencies]
# internal
afixo-proto = { path = "crates/proto" }
afixo-common = { path = "crates/common" }
afixo-engine = { path = "crates/engine" }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# HTTP (gateway only)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "util", "timeout"] }
http = "1"

# storage / messaging
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "migrate",
  "macros",
] }

# serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# errors
thiserror = "2"
anyhow = "1"

# crypto / ids / time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
base64 = "0.23"
hex = "0.4"

# outbound HTTP (GitHub OAuth)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints that fight ordinary service code
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
# dependencies optimised even in dev builds: sqlx/tonic are slow at opt-level 0
opt-level = 1
