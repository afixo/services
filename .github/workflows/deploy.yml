# Build the images whose sources changed, push them to ghcr.io (private
# packages, pushed with the workflow's own GITHUB_TOKEN), then apply an overlay
# and wait for the rollouts.
#
#   push to master      → production (namespace afixo), automatically
#   workflow_dispatch   → production (re-deploy / rebuild a chosen set of services)
#
# There is no backend staging environment for now; the staging branches below
# are commented out, not deleted (the overlay in deploy/k8s/overlays/staging stays).
#
# Environment secret (production): KUBE_CONFIG — a namespace-confined
#   ServiceAccount kubeconfig from deploy/scripts/make-ci-kubeconfig.sh <env>.
#   No DigitalOcean API token is needed anywhere.
# Repository variable (optional): IMAGE_REGISTRY
# The cluster pulls with the `registry-afixo` docker-registry Secret in each
# namespace (a PAT with read:packages) — see docs/deploy.md.
#
# A change under crates/, proto/, Cargo.*, or Dockerfile rebuilds EVERY service
# — a shared crate or a .proto edit changes all of them, and a filter watching
# only services/** would go green having shipped nothing.
name: deploy

on:
  push:
    branches: [master]
    paths:
      - "services/**"
      - "crates/**"
      - "proto/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        # options: [staging, production]   # no staging environment yet
        options: [production]
        default: production
        required: true
      services:
        description: 'Comma-separated services to build (or "all", or "none" to only re-apply manifests)'
        default: all
        required: true

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # ghcr.io/afixo/services/<service>; the image name must stay in sync with
  # deploy/k8s/base/*.yaml and the `images:` lists in both overlays.
  REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository) }}
  ALL_SERVICES: gateway auth identity policy disclosure audit

jobs:
  plan:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}   # JSON array
      any: ${{ steps.plan.outputs.any }}
      environment: ${{ steps.plan.outputs.environment }}
      overlay: ${{ steps.plan.outputs.overlay }}
      namespace: ${{ steps.plan.outputs.namespace }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            shared:
              - "crates/**"
              - "proto/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
            gateway:    ["services/gateway/**"]
            auth:       ["services/auth/**"]
            identity:   ["services/identity/**"]
            policy:     ["services/policy/**"]
            disclosure: ["services/disclosure/**"]
            audit:      ["services/audit/**"]

      - name: Resolve environment and service list
        id: plan
        env:
          INPUT: ${{ github.event.inputs.services }}
          TARGET: ${{ github.event.inputs.environment || 'production' }}
          SHARED: ${{ steps.changes.outputs.shared }}
          CHANGED: ${{ toJSON(steps.changes.outputs) }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            production) overlay=prod;    namespace=afixo ;;
            # staging)  overlay=staging; namespace=afixo-staging ;;   # no staging environment yet
            *) echo "unknown environment $TARGET" >&2; exit 1 ;;
          esac
          list=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$INPUT" in
              all)  list="$ALL_SERVICES" ;;
              none) list="" ;;
              *)    list=$(echo "$INPUT" | tr ',' ' ') ;;
            esac
          elif [ "$SHARED" = "true" ]; then
            list="$ALL_SERVICES"
          else
            for s in $ALL_SERVICES; do
              if [ "$(echo "$CHANGED" | jq -r --arg s "$s" '.[$s]')" = "true" ]; then list="$list $s"; fi
            done
          fi
          json=$(echo $list | tr ' ' '\n' | sed '/^$/d' | jq -R . | jq -cs .)
          {
            echo "services=$json"
            echo "any=$([ "$json" != "[]" ] && echo true || echo false)"
            echo "environment=$TARGET"
            echo "overlay=$overlay"
            echo "namespace=$namespace"
          } >> "$GITHUB_OUTPUT"
          echo "target: $TARGET ($overlay / $namespace); building: $json"

  build:
    name: build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: apply ${{ needs.plan.outputs.environment }} + rollout
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.environment }}
    env:
      OVERLAY: deploy/k8s/overlays/${{ needs.plan.outputs.overlay }}
      NAMESPACE: ${{ needs.plan.outputs.namespace }}
    steps:
      - uses: actions/checkout@v7
      - uses: imranismail/setup-kustomize@v3

      # Environment secret made by deploy/scripts/make-ci-kubeconfig.sh <env>:
      # a ServiceAccount token confined to this namespace, unable to read Secrets.
      - name: Cluster credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::secret KUBE_CONFIG is not set on environment '${{ needs.plan.outputs.environment }}' — run deploy/scripts/make-ci-kubeconfig.sh ${{ needs.plan.outputs.environment }}"
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Pin the images that were just built
        env:
          SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          cd "$OVERLAY"
          for s in $(echo "$SERVICES" | jq -r '.[]'); do
            kustomize edit set image "$REGISTRY/$s=$REGISTRY/$s:${{ github.sha }}"
          done
          kustomize build . > /tmp/rendered.yaml
          grep -E "image: " /tmp/rendered.yaml | sort -u

      - name: Apply
        run: kubectl apply -k "$OVERLAY"

      - name: Wait for rollouts
        env:
          SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          for s in $(echo "$SERVICES" | jq -r '.[]'); do
            kubectl -n "$NAMESPACE" rollout status deploy/"$s" --timeout=240s
          done
          kubectl -n "$NAMESPACE" get pods -o wide
