name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: afixo
          POSTGRES_PASSWORD: afixo
          POSTGRES_DB: afixo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afixo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      # `#[sqlx::test]` creates a throw-away database per test on this server
      # (it reads DATABASE_URL); unit + property tests do not need it.
      DATABASE_URL: postgres://afixo:afixo@localhost:5432/afixo
      TEST_DATABASE_URL: postgres://afixo:afixo@localhost:5432/afixo
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Not the container action: it ships its own musl toolchain, and
      # rust-toolchain.toml then points at a toolchain that is not installed.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses bans sources

  manifests:
    name: kustomize render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: |
          for env in prod staging; do
            kubectl kustomize deploy/k8s/overlays/$env > /tmp/$env.yaml
            echo "$env: $(grep -c '^kind:' /tmp/$env.yaml) resources"
          done

  image:
    name: docker build (gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build without pushing — validates the Dockerfile and warms the cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: SERVICE=gateway
          tags: afixo/gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
