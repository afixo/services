# PostgreSQL in the cluster — one instance per namespace, one database per
# service (the same layout as compose.yml / deploy/local/init-databases.sql).
# A StatefulSet keeps the stable name `postgres-0` and a DigitalOcean block
# volume (Retain class: deleting the StatefulSet or the namespace never deletes
# the data; remove the PV by hand if you really mean it).
#
# Services reach it at postgres:5432. The password is POSTGRES_PASSWORD in
# `afixo-secrets`; deploy/scripts/create-secrets.sh derives the four
# *_DATABASE_URL values from it. No TLS: traffic never leaves the namespace
# and the NetworkPolicy below admits only the backend tier.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Runs ONLY on the first boot of an empty volume. A database added later
  # must be created by hand:
  #   kubectl -n <ns> exec -it postgres-0 -- psql -U afixo -c 'create database afixo_new;'
  01-init-databases.sql: |
    create database afixo_auth;
    create database afixo_identity;
    create database afixo_policy;
    create database afixo_audit;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        afixo.io/tier: data
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # `postgres` in postgres:*-alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          # Sized for a shared 2 GB node; defaults would starve the services.
          args:
            - -c
            - max_connections=40
            - -c
            - shared_buffers=48MB
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_wal_size=256MB
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: afixo
            - name: POSTGRES_DB
              value: afixo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afixo-secrets
                  key: POSTGRES_PASSWORD
            # A DigitalOcean volume arrives with lost+found in it and initdb
            # refuses a non-empty directory; a subdirectory sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "afixo", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "afixo", "-h", "127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage-retain
        resources:
          requests:
            storage: 10Gi
