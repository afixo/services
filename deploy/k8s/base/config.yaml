# Non-secret configuration shared by every service (production values; the
# staging overlay patches the hostname-bearing keys). Secrets live in the
# `afixo-secrets` Secret, created out-of-band by deploy/scripts/create-secrets.sh
# with these keys:
#   AUTH_DATABASE_URL, IDENTITY_DATABASE_URL, POLICY_DATABASE_URL, AUDIT_DATABASE_URL
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
apiVersion: v1
kind: ConfigMap
metadata:
  name: afixo-config
data:
  RUST_LOG: "info,sqlx=warn,h2=warn,hyper=warn"
  LOG_FORMAT: "json"
  AUTH_URL: "http://auth:50051"
  IDENTITY_URL: "http://identity:50051"
  POLICY_URL: "http://policy:50051"
  DISCLOSURE_URL: "http://disclosure:50051"
  AUDIT_URL: "http://audit:50051"
  # The dashboard's Explorer calls the machine API cross-origin (afixo.io → api.afixo.io).
  CORS_ALLOWED_ORIGINS: "https://afixo.io,https://www.afixo.io"
  GITHUB_REDIRECT_URI: "https://afixo.io/api/v1/auth/github/callback"
  PUBLIC_BASE_URL: "https://afixo.io"
