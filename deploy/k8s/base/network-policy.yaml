# Ingress is default-deny in the namespace; each allowed path is listed.
# Egress is left open (managed Postgres, GitHub, the Cloudflare edge).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Only cloudflared may reach the gateway, on its two listeners.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-cloudflared
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 8080
        - port: 8081
---
# gRPC services accept calls from the backend tier only (gateway + services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grpc-from-backend
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [auth, identity, policy, disclosure, audit]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              afixo.io/tier: backend
      ports:
        - port: 50051
