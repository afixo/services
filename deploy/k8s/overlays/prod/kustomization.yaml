# Production: namespace `afixo`, hostnames origin.afixo.io / origin-api.afixo.io
# (base values). DOKS `k8s-afixo-io-fra1`, 1 × s-1vcpu-2gb as of 2026-08-22.
# Image tags are rewritten by CI (`kustomize edit set image …:<sha>`);
# `latest` is only a placeholder for a first manual apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: afixo

resources:
  - namespace.yaml
  - ../../base

# ghcr.io pull credentials (the packages are private), created once per namespace:
#   deploy/scripts/create-pull-secret.sh <PAT with read:packages> production
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-afixo

images:
  - name: ghcr.io/afixo/services/gateway
    newTag: latest
  - name: ghcr.io/afixo/services/auth
    newTag: latest
  - name: ghcr.io/afixo/services/identity
    newTag: latest
  - name: ghcr.io/afixo/services/policy
    newTag: latest
  - name: ghcr.io/afixo/services/disclosure
    newTag: latest
  - name: ghcr.io/afixo/services/audit
    newTag: latest
