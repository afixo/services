# Staging: namespace `afixo-staging` on the same cluster, its own tunnel
# (origin-staging.afixo.io / origin-api-staging.afixo.io), its own databases
# and secrets, reached through the afixo-web-staging / afixo-api-staging Workers
# at staging.afixo.io / api-staging.afixo.io.
#
# Same images as production; `master` deploys here automatically (deploy.yml),
# production is promoted by workflow_dispatch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: afixo-staging

resources:
  - namespace.yaml
  - ../../base

patches:
  # ghcr.io pull credentials (the packages are private), created once per namespace:
  #   kubectl -n afixo-staging create secret docker-registry registry-afixo \
  #     --docker-server=ghcr.io --docker-username=<github user> --docker-password=<PAT with read:packages>
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-afixo
  - path: config-patch.yaml
  - path: cloudflared-patch.yaml

images:
  - name: ghcr.io/afixo/services/gateway
    newTag: latest
  - name: ghcr.io/afixo/services/auth
    newTag: latest
  - name: ghcr.io/afixo/services/identity
    newTag: latest
  - name: ghcr.io/afixo/services/policy
    newTag: latest
  - name: ghcr.io/afixo/services/disclosure
    newTag: latest
  - name: ghcr.io/afixo/services/audit
    newTag: latest
